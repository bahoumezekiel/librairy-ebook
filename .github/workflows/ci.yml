# Contrôles automatiques à chaque envoi de code : style, tests, types, compilation.
# Rien n'est déployé ici : la mise en production se fait depuis Dokploy (voir le README).

name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API (style et tests)
    # Version figée : l'étiquette `ubuntu-latest` bascule sur Ubuntu 26.04 en
    # novembre 2026, ce qui changerait les outils préinstallés sans prévenir.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fasolib
          POSTGRES_USER: fasolib
          POSTGRES_PASSWORD: fasolib
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fasolib"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Clé sans valeur, propre aux contrôles : 64 caractères, assez longue pour que
      # Django et la bibliothèque de jetons ne signalent pas une signature faible.
      DJANGO_SECRET_KEY: cle-de-controle-sans-valeur-ne-jamais-utiliser-ailleurs-2f9c4e71
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: fasolib
      POSTGRES_USER: fasolib
      POSTGRES_PASSWORD: fasolib
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5434"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_PRIVATE_BUCKET: fasolib-prive
      # Même nom qu'en production : c'est aussi le chemin sous lequel Nginx sert les
      # couvertures, et le contrôle de déploiement ci-dessous le vérifie.
      S3_PUBLIC_BUCKET: media
      S3_ACCESS_KEY: fasolib
      S3_SECRET_KEY: fasolib-secret-de-test

    steps:
      - uses: actions/checkout@v7

      # Démarré à la main, et non en `services` : l'image a besoin de ses arguments.
      # Le volume n'est pas une option : /data n'existe pas dans l'image, et le backend
      # posix s'y installe au démarrage. Sans lui, le conteneur s'arrête aussitôt.
      - name: Stockage objet compatible S3
        run: |
          docker run --detach --name s3 --publish 9000:7070 \
            --env ROOT_ACCESS_KEY=$S3_ACCESS_KEY \
            --env ROOT_SECRET_KEY=$S3_SECRET_KEY \
            --volume s3_data:/data \
            versity/versitygw posix /data

          # La passerelle répond 403 sur la racine : n'importe quelle réponse HTTP
          # suffit à prouver qu'elle écoute. On abandonne dès que le conteneur meurt,
          # au lieu d'attendre dans le vide, et on montre son journal : un échec doit
          # nommer sa cause, pas se contenter d'un dépassement de délai.
          for _ in $(seq 60); do
            if curl --silent --max-time 3 http://127.0.0.1:9000 >/dev/null 2>&1; then
              echo "Stockage objet prêt."
              exit 0
            fi
            docker inspect --format '{{.State.Running}}' s3 | grep -q true || break
            sleep 1
          done
          echo "::error::Le stockage objet n'a pas démarré."
          docker logs s3
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: Backend/requirements-dev.txt

      - run: pip install --requirement requirements-dev.txt

      - name: Style du code
        run: ruff check .

      # Vérifie la configuration telle qu'elle sera en production : clés Genius Pay
      # exigées, HTTPS imposé, documentation de l'API fermée.
      - name: Contrôles Django, y compris ceux du déploiement
        run: python manage.py check --deploy
        env:
          DJANGO_DEBUG: "False"
          # Exigé en production : sans lui, l'API refuse de démarrer (réglage vérifié ici).
          EMAIL_HOST: smtp.exemple-de-controle.test
          GENIUSPAY_API_SECRET: cle-de-controle-sans-valeur
          GENIUSPAY_WEBHOOK_SECRET: cle-de-controle-sans-valeur

      - name: Tests
        run: pytest -q

  frontend:
    name: Site (types et compilation)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      # Vérifie les types, puis compile : les deux doivent passer.
      - run: npm run build
