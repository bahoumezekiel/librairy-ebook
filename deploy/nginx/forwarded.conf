# Protocole vu par le client, transmis ensuite à Django.
#
# Ce fichier est inclus au niveau `http` (une directive `map` n'est pas permise dans un
# bloc `server`), et il doit l'être avant la configuration du site, d'où le préfixe `00-`
# que lui donne le Dockerfile.
#
# Pourquoi : derrière un répartiteur qui termine le HTTPS (Traefik chez Dokploy, ou un
# autre Nginx), notre Nginx reçoit la requête en clair. S'il annonçait `$scheme` à Django,
# Django croirait la connexion non sécurisée et renverrait le client vers HTTPS… d'où une
# boucle de redirection sans fin. On reprend donc le protocole annoncé en amont quand il
# existe, et seulement à défaut le nôtre.

map $http_x_forwarded_proto $protocole_client {
    default $scheme;
    https   https;
    http    http;
}
