# Configuration HTTPS, à mettre en place une fois le certificat obtenu.
# Remplacez `fasolib.bf` par votre nom de domaine aux quatre endroits indiqués.

# Tout le trafic en clair est renvoyé vers HTTPS, sauf la vérification du certificat.
server {
    listen 80;
    server_name fasolib.bf www.fasolib.bf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fasolib.bf www.fasolib.bf;

    ssl_certificate /etc/letsencrypt/live/fasolib.bf/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fasolib.bf/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Le navigateur refusera désormais toute connexion en clair à ce domaine.
    # À n'activer qu'une fois le certificat vérifié : la consigne est gardée un an.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/fasolib/common.conf;
}
