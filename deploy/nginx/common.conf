# Corps commun du serveur FasoLib, inclus dans un bloc `server` (HTTP ou HTTPS).
#
# Le site React et l'API partagent un seul nom de domaine : le navigateur ne parle qu'à
# une origine, le cookie de session est donc envoyé normalement et il n'y a aucun CORS.

# 100 Mo pour le fichier d'un livre, plus la marge du formulaire multipart.
client_max_body_size 110m;

# Le site compilé, produit par `npm run build`.
root /usr/share/nginx/html;
index index.html;

# --- En-têtes de sécurité, appliqués à toutes les réponses ---------------------
# Les blocs `location` ci-dessous n'ajoutent aucun en-tête (ils utilisent `expires`),
# sinon nginx cesserait d'hériter de ceux-ci.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# `img-src` : remplacez https://media.example.bf par le domaine de votre stockage objet,
# d'où viennent les couvertures. `worker-src blob:` est exigé par le lecteur PDF,
# `frame-src blob:` par le lecteur EPUB, `style-src unsafe-inline` par les animations.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://media.example.bf; connect-src 'self'; frame-src 'self' blob:; manifest-src 'self'" always;

# --- Compression ---------------------------------------------------------------

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;

# --- L'API ---------------------------------------------------------------------

location ~ ^/(api|geniuspay)/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Lu par DRF pour limiter les tentatives par adresse IP réelle.
    # Comptez un proxy par étape qui ajoute une entrée ici, et reportez ce nombre
    # dans `NUM_PROXIES` : 1 pour Nginx seul, 2 derrière Traefik (Dokploy).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Lu par Django (SECURE_PROXY_SSL_HEADER) pour savoir que le client est en HTTPS.
    # Voir `forwarded.conf` : c'est le protocole vu du client, pas celui de ce Nginx.
    proxy_set_header X-Forwarded-Proto $protocole_client;
    # L'envoi d'un livre et le téléchargement d'un exemplaire chiffré prennent du temps.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    # Réponse envoyée au fur et à mesure : un livre de 100 Mo n'est pas mis en tampon.
    proxy_buffering off;
}

# --- Le site React -------------------------------------------------------------

# Nginx ne connaît pas l'extension `.mjs` : il servirait le moteur du lecteur PDF en
# « application/octet-stream », et le navigateur refuse d'exécuter un module servi ainsi
# (« Failed to load module script »). Le lecteur n'ouvrirait alors aucun livre.
# Ce bloc est une expression régulière : il passe donc avant `/assets/`, d'où le cache ici.
location ~ \.mjs$ {
    default_type application/javascript;
    expires 1y;
}

# Fichiers compilés : leur nom contient une empreinte, ils ne changent jamais.
# `expires` suffit à écrire l'en-tête de cache, là où un `add_header` ferait perdre
# à ce bloc tous les en-têtes de sécurité ci-dessus.
location /assets/ {
    expires 1y;
}

# Ces trois fichiers décident de la version servie : ils ne sont jamais mis en cache.
location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
    expires -1;
}

# Toute autre adresse ouvre l'application : /catalogue, /admin/livres… fonctionnent
# après un rechargement de la page.
location / {
    try_files $uri /index.html;
}
