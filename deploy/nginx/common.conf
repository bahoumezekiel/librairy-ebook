# Corps commun du serveur FasoLib, inclus dans un bloc `server` (HTTP ou HTTPS).
#
# Le site React et l'API partagent un seul nom de domaine : le navigateur ne parle qu'à
# une origine, le cookie de session est donc envoyé normalement et il n'y a aucun CORS.

# 100 Mo pour le fichier d'un livre, plus la marge du formulaire multipart.
client_max_body_size 110m;

# La version de Nginx n'apprend rien à un visiteur, mais indique à un attaquant
# quelles failles connues tenter.
server_tokens off;

# Connexions simultanées par adresse (zones définies dans `limites.conf`).
limit_conn connexions 20;

# Le site compilé, produit par `npm run build`.
root /usr/share/nginx/html;
index index.html;

# --- En-têtes de sécurité, appliqués à toutes les réponses ---------------------
# Les blocs `location` ci-dessous n'ajoutent aucun en-tête (ils utilisent `expires`),
# sinon nginx cesserait d'hériter de ceux-ci.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Isole la page des autres onglets ouverts depuis elle, et empêche un site tiers
# d'embarquer nos réponses dans ses propres pages.
# `Cross-Origin-Embedder-Policy: require-corp` complète les deux précédents : avec eux,
# la page devient « isolée entre origines » (`window.crossOriginIsolated`), et plus aucune
# ressource étrangère ne peut y être chargée sans y consentir explicitement.
# Il n'était posable que depuis que les couvertures viennent de notre origine (relais
# `/media/` plus bas) ; les deux lecteurs ont été éprouvés sous cet en-tête, PDF comme
# EPUB, qui travaillent avec des `blob:` — ceux-ci héritent de l'origine de la page.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# `img-src 'self'` suffit : les couvertures sont servies par le domaine du site, et non
# par le stockage objet (relais `/media/` plus bas). `worker-src blob:` est exigé par le lecteur PDF,
# `frame-src blob:` par le lecteur EPUB, `style-src unsafe-inline` par les animations.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; manifest-src 'self'" always;

# --- Compression ---------------------------------------------------------------

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;

# --- L'API ---------------------------------------------------------------------

# Trois portes, trois débits. Le préfixe `^~` arrête la recherche : ces blocs passent
# avant les expressions régulières du site, et le plus long préfixe l'emporte, donc
# `/api/auth/` est bien servi par sa propre règle, et non par celle de `/api/`.
# Les réglages de transmission, identiques, sont dans `proxy-api.conf`.

# Connexion, inscription, mot de passe oublié. Limite serrée : c'est ici qu'on viendrait
# essayer des mots de passe en masse. Django limite ensuite plus finement.
location ^~ /api/auth/ {
    limit_req zone=auth burst=10 nodelay;
    include /etc/nginx/fasolib/proxy-api.conf;
}

# Notifications de paiement. Chacune fait vérifier une signature HMAC : une adresse qui
# en déverse des milliers cherche à occuper le serveur, pas à payer.
location ^~ /geniuspay/ {
    limit_req zone=paiement burst=30 nodelay;
    include /etc/nginx/fasolib/proxy-api.conf;
}

# Le reste de l'API. Large : la page de suivi d'une commande interroge en boucle.
location ^~ /api/ {
    limit_req zone=api burst=100 nodelay;
    include /etc/nginx/fasolib/proxy-api.conf;
}

# --- Les couvertures -----------------------------------------------------------

# Le stockage objet ne quitte jamais le réseau privé de la composition : aucun navigateur
# ne peut l'atteindre, et il n'a pas à en sortir. Nginx le relaie donc ici, et les
# couvertures sont servies par le domaine du site. Le compartiment public porte le nom du
# chemin — `media` — pour qu'aucune adresse n'ait à être réécrite au passage.
#
# Le nom `s3` est résolu à chaque requête, comme pour l'API : Docker donne une nouvelle
# adresse à un conteneur recréé, et une adresse retenue au démarrage finirait en 502.
#
# Pas de `limit_req` ici : une page de catalogue demande ses vingt couvertures d'un coup,
# et une limite au débit des requêtes les ferait clignoter. Ce qui borne cette porte,
# c'est `limit_conn` au niveau du serveur, et un cache de trente jours chez le visiteur.
location ^~ /media/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $stockage s3;
    proxy_pass http://$stockage:7070$request_uri;

    # `expires` et non `add_header` : ce bloc garde ainsi les en-têtes de sécurité
    # déclarés plus haut, qu'un `add_header` local ferait tous disparaître.
    expires 30d;
}

# --- Le site React -------------------------------------------------------------

# Nginx ne connaît pas l'extension `.mjs` : il servirait le moteur du lecteur PDF en
# « application/octet-stream », et le navigateur refuse d'exécuter un module servi ainsi
# (« Failed to load module script »). Le lecteur n'ouvrirait alors aucun livre.
# Ce bloc est une expression régulière : il passe donc avant `/assets/`, d'où le cache ici.
location ~ \.mjs$ {
    default_type application/javascript;
    expires 1y;
}

# Fichiers compilés : leur nom contient une empreinte, ils ne changent jamais.
# `expires` suffit à écrire l'en-tête de cache, là où un `add_header` ferait perdre
# à ce bloc tous les en-têtes de sécurité ci-dessus.
location /assets/ {
    expires 1y;
}

# Ces trois fichiers décident de la version servie : ils ne sont jamais mis en cache.
location ~ ^/(index\.html|sw\.js|manifest\.webmanifest)$ {
    expires -1;
}

# Toute autre adresse ouvre l'application : /catalogue, /admin/livres… fonctionnent
# après un rechargement de la page.
location / {
    try_files $uri /index.html;
}
