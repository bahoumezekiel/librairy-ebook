# Transmission d'une requête à l'API Django.
#
# Inclus par chacun des blocs `location` de l'API (`common.conf`) : ils ne diffèrent
# que par leur limite de débit, et ces réglages-là n'ont pas à être recopiés trois fois.

# Docker donne une nouvelle adresse au conteneur de l'API chaque fois qu'il est recréé,
# donc à chaque déploiement. Nginx, lui, ne résout un nom écrit en clair qu'une seule
# fois, au démarrage : après une mise à jour qui ne recrée que l'API, il appellerait une
# adresse morte et tout le site répondrait 502 jusqu'au redémarrage du conteneur web.
#
# Passer par une variable oblige Nginx à redemander l'adresse au résolveur interne de
# Docker (127.0.0.11), ici au plus toutes les 10 secondes. `$request_uri` est alors
# obligatoire : avec une variable, Nginx ne transmet plus l'adresse demandée tout seul.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api api;
proxy_pass http://$api:8000$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $host;
# `$remote_addr` est la vraie adresse du client : `limites.conf` l'a rétablie à partir
# de l'en-tête posé par Traefik.
proxy_set_header X-Real-IP $remote_addr;
# Lu par DRF pour limiter les tentatives par adresse IP réelle.
# Comptez un proxy par étape qui ajoute une entrée ici, et reportez ce nombre
# dans `NUM_PROXIES` : 1 pour Nginx seul, 2 derrière Traefik (Dokploy).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Lu par Django (SECURE_PROXY_SSL_HEADER) pour savoir que le client est en HTTPS.
# Voir `forwarded.conf` : c'est le protocole vu du client, pas celui de ce Nginx.
proxy_set_header X-Forwarded-Proto $protocole_client;
# L'envoi d'un livre et le téléchargement d'un exemplaire chiffré prennent du temps.
proxy_read_timeout 180s;
proxy_send_timeout 180s;
# Réponse envoyée au fur et à mesure : un livre de 100 Mo n'est pas mis en tampon.
proxy_buffering off;
