# Vraie adresse du client, et limitation du débit par adresse.
#
# Inclus au niveau `http` (conf.d), car `limit_req_zone` et `set_real_ip_from` n'ont
# pas leur place dans un bloc `server`.

# --- Retrouver le client derrière les proxys -----------------------------------
#
# Sans cela, toutes les requêtes porteraient l'adresse de Traefik : une seule et même
# adresse pour tous les visiteurs. La limitation ci-dessous les punirait tous ensemble,
# et les journaux ne montreraient jamais qui fait quoi.
#
# Seuls les réseaux privés sont crus : aucun client d'Internet ne peut joindre ce
# conteneur directement, donc seul un proxy de la machine peut renseigner cet en-tête.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
# Remonte la chaîne en ignorant les proxys connus : avec Traefik puis Nginx, la
# vraie adresse du client est retenue.
real_ip_recursive on;

# --- Limitation du débit --------------------------------------------------------
#
# Première barrière, avant même que Django ne soit sollicité : elle coûte quelques
# octets par adresse, là où une requête transmise mobilise un fil d'exécution, une
# connexion à la base, et — pour une notification de paiement — un calcul de signature.
# Django limite ensuite plus finement (inscription, connexion, mot de passe oublié).
#
# 1 Mo tient environ 16 000 adresses ; au-delà, les plus anciennes sont oubliées.

# Consultation du site et de l'API : la page de suivi d'une commande interroge en boucle.
limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
# Connexion, inscription, mot de passe oublié : vise l'essai de mots de passe en masse.
limit_req_zone $binary_remote_addr zone=auth:5m rate=20r/m;
# Notifications de paiement : le prestataire en envoie quelques-unes par commande.
# Une adresse qui en déverse des milliers ne cherche qu'à faire calculer des signatures.
limit_req_zone $binary_remote_addr zone=paiement:5m rate=60r/m;
# Connexions simultanées par adresse : un seul visiteur n'en ouvre pas vingt.
limit_conn_zone $binary_remote_addr zone=connexions:10m;

# 429 « trop de requêtes » plutôt que 503 : le client comprend qu'il doit ralentir,
# et non que le serveur est en panne.
limit_req_status 429;
limit_conn_status 429;
# Refus consigné en `warn` : une attaque se lit dans les journaux sans les noyer.
limit_req_log_level warn;
