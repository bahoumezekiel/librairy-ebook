# Configuration servie telle quelle par l'image (HTTP seul).
#
# À utiliser pour la première mise en route, le temps d'obtenir le certificat.
# Passez ensuite à `https.conf` (voir docs/EXPLOITATION.md) : la connexion d'un client
# ne doit pas circuler en clair.

server {
    listen 80;
    server_name _;

    # Vérification du domaine par Let's Encrypt (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/fasolib/common.conf;
}
