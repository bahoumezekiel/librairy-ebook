# Le seul serveur de l'image. Nginx écoute en clair sur le port 80, à l'intérieur du
# réseau Docker : c'est Traefik, devant lui, qui termine le HTTPS et obtient le
# certificat. Rien de tout cela n'a donc à figurer ici.

server {
    listen 80;
    server_name _;

    include /etc/nginx/fasolib/common.conf;
}
